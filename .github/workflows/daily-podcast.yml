name: Daily podcast

on:
  # 09:00 UTC, Monday to Friday — 5am US Eastern, so the episode is waiting
  # before the first coffee. Insurance news is a weekday business.
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Cheap guard: catches a broken script before it burns API credit.
      - name: Run offline checks
        run: python tests/test_offline.py

      - name: Generate today's episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # Gemini-TTS runs on Vertex AI and rejects API keys. Paste the whole
          # service-account JSON as this secret.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          # Only needed for an organisation-scoped Anthropic key. Harmless when empty.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: python scripts/generate_episode.py

      - name: Commit and push the new episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git commit -m "Episode: $(date -u +'%Y-%m-%d')"
          # Rebase first, or the push intermittently fails with "rejected — fetch first".
          git pull --rebase origin main
          git push
